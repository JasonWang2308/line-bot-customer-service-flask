<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Customer Service</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='viewer.css') }}">
  <style>
    /* 加上「回聊天列表」按鈕 — 模擬器專屬 */
    .chat-header .back-link {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50%;
      color: #fff; text-decoration: none;
      background: rgba(255,255,255,0.08);
      font-size: 22px; line-height: 1;
      margin-right: 4px;
      transition: background 0.15s;
    }
    .chat-header .back-link:hover { background: rgba(255,255,255,0.18); }

    /* 右上角的工具列 (編輯/留言) — 模擬器專屬 */
    .header-tools {
      margin-left: auto;
      display: inline-flex; gap: 8px;
    }
    .header-tools a {
      color: #cfe1f0; text-decoration: none; font-size: 12px;
      padding: 4px 8px; border-radius: 6px;
      background: rgba(255,255,255,0.08);
    }
    .header-tools a:hover { background: rgba(255,255,255,0.18); color: #fff; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="chat-header">
      <a href="/" class="back-link" title="回聊天列表">‹</a>
      <div class="avatar">客</div>
      <div class="title">Demo Customer Service</div>
      <div class="header-tools">
        <a href="/editor" target="_blank" rel="noopener">編輯選單</a>
        <a href="/admin/messages" target="_blank" rel="noopener">留言管理</a>
      </div>
    </header>
    <main id="chat-log" class="chat-log"></main>
    <footer class="chat-footer">
      <div class="upload-row">
        <button type="button" class="upload-btn" data-type="sticker">貼圖</button>
        <button type="button" class="upload-btn" data-type="image">圖片</button>
        <button type="button" class="upload-btn" data-type="video">影片</button>
        <button type="button" class="upload-btn" data-type="audio">聲音</button>
        <button type="button" id="reset-btn" class="reset-btn">重新開始</button>
      </div>
      <div class="input-row">
        <input id="msg-input" type="text" placeholder="輸入訊息..." autocomplete="off">
        <button type="button" id="send-btn" class="send-btn">送出</button>
      </div>
    </footer>
  </div>
  <script>window.APP_CONSTANTS = {{ constants | tojson }};</script>
  <script src="{{ url_for('static', filename='menu-utils.js') }}"></script>
  <script src="{{ url_for('static', filename='viewer.js') }}"></script>
</body>
</html>
